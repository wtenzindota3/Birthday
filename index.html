<script>

// ===== FLOW CONTROL =====
let stage = 0;

function startGame() {
    stage1();
}

// ===== STAGE 1: HEART CATCH =====
function stage1() {
    document.getElementById("main").innerHTML =
    "<h2>Level 1: Catch me ❤️</h2>";

    let heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.className = "heart";
    document.body.appendChild(heart);

    moveHeart(heart);

    heart.onclick = () => {
        heart.remove();
        stage2();
    };
}

function moveHeart(el) {
    setInterval(() => {
        el.style.top = Math.random() * window.innerHeight + "px";
        el.style.left = Math.random() * window.innerWidth + "px";
    }, 600);
}

// ===== STAGE 2: MEMORY QUIZ =====
function stage2() {
    document.getElementById("main").innerHTML = `
    <h2>Level 2: Answer this 😏</h2>
    <p>What makes you happiest?</p>
    <button onclick="wrong()">Food</button>
    <button onclick="wrong()">Sleep</button>
    <button onclick="correct()">Me 😌</button>
    `;
}

function wrong() {
    alert("Hmm… try again 👀");
}

function correct() {
    stage3();
}

// ===== STAGE 3: FIND SECRET =====
function stage3() {
    document.getElementById("main").innerHTML =
    "<h2>Level 3: Find the hidden surprise 👀</h2>";

    let secret = document.createElement("div");
    secret.style.position = "absolute";
    secret.style.top = Math.random() * window.innerHeight + "px";
    secret.style.left = Math.random() * window.innerWidth + "px";
    secret.style.width = "30px";
    secret.style.height = "30px";
    secret.style.background = "transparent";

    document.body.appendChild(secret);

    secret.onclick = () => {
        secret.remove();
        startStory();
    };
}

// ===== STORY (UPGRADED FEEL) =====
let messages = [
"You made it…",
"Most people wouldn’t even try this far.",
"But you did.",
"And that’s exactly why this is for you.",
"I don’t say this enough...",
"But I’m genuinely grateful for you.",
"You’ve made my life better in ways you probably don’t even realize.",
"And I’ll always appreciate that.",
"Happy Birthday 🎂"
];

let index = 0;

function startStory() {
    document.getElementById("main").innerHTML =
    `<h1 id="text"></h1><button onclick="next()">Next</button>`;
    typeText();
}

function typeText() {
    let text = messages[index];
    let i = 0;
    let display = "";

    function typing() {
        if (i < text.length) {
            display += text[i];
            document.getElementById("text").innerHTML = display;
            i++;
            setTimeout(typing, 35);
        }
    }
    typing();
}

function next() {
    index++;
    if (index < messages.length) {
        typeText();
    } else {
        finalLetter();
    }
}

// ===== FINAL LETTER (STRONGER) =====
function finalLetter() {
    document.getElementById("main").innerHTML = `
    <h2>Final Message 💌</h2>
    <p style="line-height:1.7">
    I just want you to know this wasn’t random.<br><br>
    I actually put time into this because you matter to me.<br><br>
    I’m really grateful for you — for your presence, your energy, and the way you exist in my life.<br><br>
    I hope this year brings you peace, happiness, and everything you deserve.<br><br>
    And no matter what happens,<br>
    just know… you’re appreciated more than you think.<br><br>
    Happy Birthday ❤️<br><br>
    — Tenzin
    </p>
    `;
}

</script>
