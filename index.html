<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: black;
    color: white;
    text-align: center;
    overflow: hidden;
}

.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 90%;
}

button {
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    margin: 10px;
    cursor: pointer;
}

input {
    padding: 10px;
    border-radius: 10px;
}

.heart {
    position: absolute;
    font-size: 30px;
    cursor: pointer;
}

img {
    width: 200px;
    border-radius: 12px;
    margin-top: 10px;
}
</style>

</head>

<body>

<audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main">
    <h2>Enter Password 🔐</h2>
    <input type="password" id="pass">
    <br>
    <button onclick="check()">Enter</button>
</div>

<script>

const password = "2142006";

// ---------- PASSWORD ----------
function check(){
    if(document.getElementById("pass").value === password){
        game1();
    } else {
        alert("Wrong 👀");
    }
}

// ---------- GAME 1: BALANCED HEART GAME ----------
function game1(){
    document.getElementById("main").innerHTML =
    "<h2>Level 1: Catch the heart ❤️</h2><p>Hint: it slows down after time...</p>";

    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    document.body.appendChild(heart);

    let speed = 900; // starts slow-ish movement

    function move(){
        heart.style.top = Math.random() * window.innerHeight + "px";
        heart.style.left = Math.random() * window.innerWidth + "px";
    }

    // movement interval
    let gameInterval = setInterval(move, speed);

    // after 10 seconds → slightly easier
    setTimeout(() => {
        clearInterval(gameInterval);
        speed = 1300;
        gameInterval = setInterval(move, speed);
    }, 10000);

    // after 18 seconds → almost catchable
    setTimeout(() => {
        clearInterval(gameInterval);
        speed = 2000;
        gameInterval = setInterval(move, speed);
    }, 18000);

    // auto help (subtle hint)
    setTimeout(() => {
        heart.style.transform = "scale(1.3)";
    }, 15000);

    heart.onclick = () => {
        heart.remove();
        game2();
    };
}
```


// ---------- GAME 2: QUIZ ----------
function game2(){
    document.getElementById("main").innerHTML = `
    <h2>Quick question 😏</h2>
    <p>Who wins in Mobile Legends when we play?</p>
    <button onclick="wrong()">You</button>
    <button onclick="correct()">Us 😎</button>
    `;

}

function wrong(){
    alert("Hmm try again 😂");
}

function correct(){
    game3();
}

// ---------- GAME 3: SECRET CLICK ----------
function game3(){
    document.getElementById("main").innerHTML = "<h2>Find the hidden surprise 👀</h2>";

    let box = document.createElement("div");
    box.style.position = "absolute";
    box.style.width = "40px";
    box.style.height = "40px";
    box.style.top = Math.random()*window.innerHeight+"px";
    box.style.left = Math.random()*window.innerWidth+"px";
    box.style.background = "transparent";
    document.body.appendChild(box);

    box.onclick = ()=>{
        box.remove();
        choice();
    }
}

// ---------- CHOICE ----------
function choice(){
    document.getElementById("main").innerHTML = `
    <h2>Can I send you my picture? 📸</h2>
    <button onclick="yes()">Yes</button>
    <button onclick="no()">No</button>
    `;
}

function no(){
    document.getElementById("main").innerHTML = `
    <h2>Hmm okay 😌</h2>
    <p>But I think you might still say yes later...</p>
    <button onclick="yes()">Actually yes</button>
    `;
}

function yes(){
    story();
}

// ---------- STORY ----------
function story(){
    document.getElementById("main").innerHTML = `
    <h2>...</h2>
    <p style="line-height:1.6">

    You’re actually one of the most special people I’ve met.<br><br>

    You’re really one of a kind.<br><br>

    I’m grateful for you — not in a dramatic way, just real appreciation.<br><br>

    Happy Birthday 🎂 and I love you gurl<br><br>

    — Tenzin
    </p>
    <button onclick="final()">Next</button>
    `;
}

// ---------- FINAL SURPRISE ----------
function final(){
    document.getElementById("main").innerHTML = `
    <h2>One last surprise 👀</h2>
    <p>If you’re reading this… you completed everything.</p>
    <p>You didn’t just click through — you actually went through it.</p>
    <p>That means something.</p>
    <h3>Happy Birthday again ❤️</h3>
    `;
}

</script>
