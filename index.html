<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: black;
    color: white;
    text-align: center;
    overflow: hidden;
}

.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 90%;
}

button {
    padding: 10px 18px;
    margin: 10px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

input {
    padding: 10px;
    border-radius: 10px;
}

.heart {
    position: absolute;
    font-size: 30px;
    cursor: pointer;
}

img {
    width: 200px;
    border-radius: 12px;
    margin-top: 10px;
}
</style>

</head>

<body>

<audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main">
    <h2>Enter Password 🔐</h2>
    <input type="password" id="pass"><br>
    <button onclick="check()">Enter</button>
</div>

<script>

const password = "2142006";

// ---------------- PASSWORD ----------------
function check(){
    if(document.getElementById("pass").value === password){
        game1();
    } else {
        alert("Wrong 👀");
    }
}

// ---------------- GAME 1 ----------------
function game1(){
    document.getElementById("main").innerHTML =
    "<h2>Level 1 ❤️</h2><p>Catch the heart… it gets easier over time</p>";

    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    document.body.appendChild(heart);

    let interval = setInterval(move, 800);

    function move(){
        heart.style.top = Math.random()*window.innerHeight+"px";
        heart.style.left = Math.random()*window.innerWidth+"px";
    }

    setTimeout(()=>{ clearInterval(interval); interval = setInterval(move,1200); },10000);
    setTimeout(()=>{ clearInterval(interval); interval = setInterval(move,2000); },18000);

    heart.onclick = ()=>{
        heart.remove();
        game2();
    };
}

// ---------------- GAME 2 ----------------
function game2(){
    document.getElementById("main").innerHTML = `
    <h2>Level 2 😏</h2>
    <p>Who wins in Mobile Legends?</p>
    <button onclick="wrong()">You</button>
    <button onclick="game3()">Us 😎</button>
    `;
}

function wrong(){
    alert("Try again 😂");
}

// ---------------- GAME 3 ----------------
function game3(){
    document.getElementById("main").innerHTML = `
    <h2>Level 3 🎮 Memory Path</h2>
    <button onclick="path1()">Start</button>
    `;
}

function path1(){
    document.getElementById("main").innerHTML = `
    <h2>Pick a memory</h2>
    <button onclick="wrong1()">First meeting</button>
    <button onclick="path2()">Mobile Legends</button>
    `;
}

function wrong1(){ alert("Not that one 😭"); }

function path2(){
    document.getElementById("main").innerHTML = `
    <h2>Good 😌</h2>
    <img src="photo1.jpg">
    <p>One of our memories</p>

    <button onclick="path3()">Next</button>
    `;
}

function path3(){
    document.getElementById("main").innerHTML = `
    <h2>Almost there 👀</h2>
    <img src="photo2.jpg">
    <p>Another memory unlocked</p>

    <button onclick="askPhoto()">Continue</button>
    `;
}

// ---------------- PHOTO QUESTION ----------------
function askPhoto(){
    document.getElementById("main").innerHTML = `
    <h2>Random question 😏</h2>
    <p>Can I see your photo?</p>

    <button onclick="yesPhoto()">Yes</button>
    <button onclick="noPhoto()">No</button>

    <p id="react"></p>
    `;
}

function noPhoto(){
    document.getElementById("react").innerHTML =
    "Hmm 😌 I expected that…";

    setTimeout(()=>{
        document.getElementById("react").innerHTML =
        "But I think you’ll say yes anyway 👀";
    },1500);
}

function yesPhoto(){
    story();
}

// ---------------- STORY ----------------
function story(){
    document.getElementById("main").innerHTML = `
    <h2>I knew it 😌</h2>

    <img src="photo3.jpg">

    <p style="line-height:1.6">
    You act like you don’t care sometimes… but I know you do 😭<br><br>

    You’re my first Chinese friend — and honestly one of a kind.<br><br>

    Playing Mobile Legends with you, joking around, losing, winning… it’s always fun.<br><br>

    I’m genuinely grateful for you.<br><br>

    You make things feel lighter without even trying.<br><br>

    Happy Birthday 🎂<br><br>

    — Tenzin
    </p>

    <button onclick="final()">Next</button>
    `;
}

// ---------------- FINAL ----------------
function final(){
    document.getElementById("main").innerHTML = `
    <h2>Final Message 💌</h2>
    <p>You didn’t just click… you experienced everything.</p>
    <p>That actually means something.</p>
    <h3>You’re appreciated ❤️</h3>
    `;
}

</script>

</body>
</html>
