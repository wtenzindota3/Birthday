<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: black;
    color: white;
    text-align: center;
    overflow: hidden;
}

.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 90%;
}

button {
    padding: 10px 18px;
    margin: 10px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

input {
    padding: 10px;
    border-radius: 10px;
}

.heart {
    position: absolute;
    font-size: 30px;
    cursor: pointer;
}

img {
    width: 200px;
    border-radius: 12px;
    margin-top: 10px;
}
</style>

</head>

<body>

<audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main">
    <h2>Enter Password 🔐</h2>
    <input type="password" id="pass"><br>
    <button onclick="check()">Enter</button>
</div>

<script>

const password = "2142006";

// ---------------- PASSWORD ----------------
function check(){
    if(document.getElementById("pass").value === password){
        game1();
    } else {
        alert("Wrong 👀");
    }
}

// ---------------- GAME 1 (BALANCED HEART) ----------------
function game1(){
    document.getElementById("main").innerHTML =
    "<h2>Level 1: Catch the heart ❤️</h2><p>It gets easier over time...</p>";

    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    document.body.appendChild(heart);

    let interval = setInterval(()=>{
        heart.style.top = Math.random()*window.innerHeight+"px";
        heart.style.left = Math.random()*window.innerWidth+"px";
    }, 800);

    setTimeout(()=>{ clearInterval(interval); interval = setInterval(move,1200); },10000);

    function move(){
        heart.style.top = Math.random()*window.innerHeight+"px";
        heart.style.left = Math.random()*window.innerWidth+"px";
    }

    setTimeout(()=>{ clearInterval(interval); interval = setInterval(move,2000); },18000);

    heart.onclick = ()=>{
        heart.remove();
        game2();
    };
}

// ---------------- GAME 2 ----------------
function game2(){
    document.getElementById("main").innerHTML = `
    <h2>Level 2 😏</h2>
    <p>Who is better in Mobile Legends?</p>
    <button onclick="wrong()">You</button>
    <button onclick="correct()">Us 😎</button>
    `;
}

function wrong(){
    alert("Try again 😂");
}

function correct(){
    game3();
}

// ---------------- GAME 3 ----------------
function game3(){
    document.getElementById("main").innerHTML =
    "<h2>Find the hidden surprise 👀</h2>";

    let box = document.createElement("div");
    box.style.position = "absolute";
    box.style.width = "40px";
    box.style.height = "40px";
    box.style.top = Math.random()*window.innerHeight+"px";
    box.style.left = Math.random()*window.innerWidth+"px";
    box.style.background = "transparent";

    document.body.appendChild(box);

    box.onclick = ()=>{
        box.remove();
        choice();
    };
}

// ---------------- CHOICE ----------------
function choice(){
    document.getElementById("main").innerHTML = `
    <h2>Can I send you my picture? 📸</h2>
    <button onclick="yes()">Yes</button>
    <button onclick="no()">No</button>
    <p id="react"></p>
    `;
}

let noCount = 0;

function no(){
    noCount++;
    let r = document.getElementById("react");

    if(noCount === 1) r.innerHTML = "Hmm 😌";
    else if(noCount === 2) r.innerHTML = "Be nice 😭";
    else r.innerHTML = "Okay okay I know you want to say yes 👀";
}

function yes(){
    story();
}

// ---------------- STORY ----------------
function story(){
    document.getElementById("main").innerHTML = `
    <h2>I knew it 😌</h2>

    <p style="line-height:1.6">
    You act tough but I know you’re actually soft 😭<br><br>

    You’re my first Chinese friend — and honestly one of the realest people I know.<br><br>

    Playing Mobile Legends with you, joking, losing, winning… it’s always fun.<br><br>

    You’re one of a kind.<br><br>

    I’m genuinely grateful for you.<br><br>

    HAPPY BIRTHDAY 🎂 and I LOVE YOU GURL <3;<br><br>

    — Tenzin
    </p>

    <button onclick="final()">Next</button>
    `;
}

// ---------------- FINAL ----------------
function final(){
    document.getElementById("main").innerHTML = `
    <h2>Final Message 💌</h2>
    <p>You didn’t just click buttons… you actually went through it.</p>
    <p>That means something.</p>
    <h3>You’re appreciated more than you think ❤️</h3>
    `;
}

</script>

</body>
</html>
