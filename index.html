<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:black;
    color:white;
    text-align:center;
    overflow:hidden;
}

.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
}

button{
    padding:10px 18px;
    margin:10px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

input{
    padding:10px;
    border-radius:10px;
}

.heart{
    position:absolute;
    font-size:30px;
    cursor:pointer;
}

img{
    width:200px;
    border-radius:12px;
    margin-top:10px;
}
</style>

</head>

<body>

<audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main">
    <h2>Enter Password 🔐</h2>
    <input type="password" id="pass"><br>
    <button onclick="check()">Enter</button>
</div>

<script>

const password = "2142006";

// ---------------- PASSWORD ----------------
function check(){
    if(document.getElementById("pass").value === password){
        game1();
    } else {
        alert("Wrong 👀");
    }
}

// ---------------- GAME 1 ----------------
function game1(){
    document.getElementById("main").innerHTML =
    "<h2>Level 1 ❤️</h2><p>Catch the heart</p>";

    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    document.body.appendChild(heart);

    let interval = setInterval(()=>{
        heart.style.top = Math.random()*window.innerHeight+"px";
        heart.style.left = Math.random()*window.innerWidth+"px";
    },800);

    setTimeout(()=>{ clearInterval(interval); },18000);

    heart.onclick = ()=>{
        heart.remove();
        game2();
    };
}

// ---------------- GAME 2 ----------------
function game2(){
    document.getElementById("main").innerHTML = `
    <h2>Level 2 😏</h2>
    <p>Who carries when we play Mobile Legends?</p>
    <button onclick="wrong()">You</button>
    <button onclick="photoQ()">Us 😎</button>
    `;
}

function wrong(){
    alert("Try again 😂");
}

// ---------------- PHOTO QUESTION ----------------
function photoQ(){
    document.getElementById("main").innerHTML = `
    <h2>Quick question 😏</h2>
    <p>Can you please send me a photo of yours?</p>

    <button onclick="yesPhoto()">Yes</button>
    <button onclick="noPhoto()">No</button>

    <p id="react"></p>
    `;
}

// ONLY SHOWS REACTION, DOES NOT AUTO SKIP
function noPhoto(){
    document.getElementById("react").innerHTML =
    "Hmm 😌 okay okay";
}

function yesPhoto(){
    story();
}

// ---------------- STORY ----------------
function story(){
    document.getElementById("main").innerHTML = `
    <h2>...</h2>

    <img src="photo1.jpg">

    <p style="line-height:1.6">
    You’re actually one of the most real people I’ve met.<br><br>

    My first Chinese friend — and honestly one of a kind.<br><br>

    Playing Mobile Legends with you, joking, losing, winning… it’s always fun.<br><br>

    I’m genuinely grateful for you.<br><br>

    You make things feel lighter without even trying.<br><br>

    Happy Birthday 🎂<br><br>

    — Tenzin
    </p>

    <button onclick="final()">Next</button>
    `;
}

// ---------------- FINAL ----------------
function final(){
    document.getElementById("main").innerHTML = `
    <h2>Final Message 💌</h2>
    <p>You went through everything properly.</p>
    <p>That actually means something.</p>
    <h3>You’re appreciated ❤️</h3>
    `;
}

</script>

</body>
</html>
